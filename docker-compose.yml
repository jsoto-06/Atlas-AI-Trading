version: '3.8'

services:
  atlas-engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: atlas_ai_trading
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - BITGET_MODO_REAL=false
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
